name: Multi-Family Daily Training & Continuous Retraining Pipeline

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Trigger Reason (Scheduled / Automated Drift Trigger)'
        required: false
        default: 'Automated retraining trigger'

jobs:
  train-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Historical Backfill Cache Refresh (if needed)
        continue-on-error: true
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'agent_weather' }}
          CITY_NAME: ${{ secrets.CITY_NAME || 'Islamabad' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '33.6844' }}
          CITY_LON: ${{ secrets.CITY_LON || '73.0479' }}
        run: |
          python src/backfill.py

      - name: Execute Multi-Family Model Training & Hopsworks Registry Promotion
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'agent_weather' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CITY_NAME: ${{ secrets.CITY_NAME || 'Islamabad' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '33.6844' }}
          CITY_LON: ${{ secrets.CITY_LON || '73.0479' }}
        run: |
          python src/train.py

      - name: Upload Training & SHAP Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-shap-artifacts
          path: |
            data/training_results.json
            data/eda_artifacts/shap_*.png
            data/eda_artifacts/shap_summary_all_targets.json
          retention-days: 14
