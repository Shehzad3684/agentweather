name: Hourly Ingestion & LangGraph Agent Pipeline

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      manual_note:
        description: 'Manual Trigger Note'
        required: false
        default: 'Manual test execution'

jobs:
  run-hourly-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Ingestion & LangGraph Agent Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'agent_weather' }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CITY_NAME: ${{ secrets.CITY_NAME || 'Islamabad' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '33.6844' }}
          CITY_LON: ${{ secrets.CITY_LON || '73.0479' }}
        run: |
          python src/run_hourly.py

      - name: Upload State Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-agent-state
          path: data/latest_agent_state.json
          retention-days: 7
